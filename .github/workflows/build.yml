name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (x86, .NET Framework 4.8)
        run: dotnet build src/PstSearch/PstSearch.csproj -c Release -p:Platform=AnyCPU

      - name: Collect output
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/PstSearch/bin/Release/net48/* dist -Recurse -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'build\installer.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PstSearchTool-v1.0.8
          path: dist/

  # 在真實 Windows 上執行程式、擷取應用程式視窗畫面，commit 回 repo（公開 repo 可直接抓取檢視）
  uitest:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/PstSearch/PstSearch.csproj -c Release -p:Platform=AnyCPU

      - name: Run app and capture screenshot
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $app = Resolve-Path 'src/PstSearch/bin/Release/net48/PstSearchTool.exe'
          $p = Start-Process $app -ArgumentList '--uitest' -PassThru
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; } }'
          Start-Sleep -Seconds 6
          $p.Refresh()
          $hwnd = $p.MainWindowHandle
          for ($i = 0; $i -lt 20 -and $hwnd -eq 0; $i++) { Start-Sleep -Milliseconds 500; $p.Refresh(); $hwnd = $p.MainWindowHandle }
          Write-Host "MainWindowHandle: $hwnd"
          [W]::SetForegroundWindow($hwnd) | Out-Null
          Start-Sleep -Seconds 1
          Add-Type -AssemblyName System.Drawing
          $r = New-Object W+R
          [W]::GetWindowRect($hwnd, [ref]$r) | Out-Null
          $w = $r.Rt - $r.L
          $h = $r.B - $r.T
          $ox = $r.L
          $oy = $r.T
          if ($w -lt 100 -or $h -lt 100) {
            Add-Type -AssemblyName System.Windows.Forms
            $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $w = $sb.Width; $h = $sb.Height; $ox = $sb.X; $oy = $sb.Y
          }
          Write-Host "Capture: $ox,$oy ${w}x${h}"
          $bmp = New-Object System.Drawing.Bitmap($w, $h)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($ox, $oy, 0, 0, (New-Object System.Drawing.Size($w, $h)))
          $bmp.Save("screenshots/uitest.png")
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Screenshot saved."

      - name: Commit screenshot to repo
        run: |
          git config user.name "uitest-bot"
          git config user.email "uitest-bot@users.noreply.github.com"
          git add screenshots/
          git commit -m "uitest screenshot $(Get-Date -Format 'yyyyMMddHHmmss')" --allow-empty
          git push origin HEAD:uitest-screenshot --force

      - uses: actions/upload-artifact@v4
        with:
          name: uitest-screenshot
          path: screenshots/uitest.png
